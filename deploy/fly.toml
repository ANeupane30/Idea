# Fly.io app for the worker and the lesson server. The app name comes from CI (--app),
# one app per environment (staging, production). Secrets are set once with `fly secrets set`
# (see docs/deploy.md).
# Tokyo: the nearest Fly region to the Supabase projects (Seoul, ap-northeast-2).
primary_region = "nrt"

[env]
  # anthropic | openrouter. The key is a secret: OPENROUTER_API_KEY or ANTHROPIC_API_KEY.
  # Models: OPENROUTER_MODELS_SMART / OPENROUTER_MODELS_FAST (defaults are free models; see worker/src/worker/config.py).
  LLM_PROVIDER = "openrouter"

[processes]
  worker = "python -m worker"
  lesson = "python -m worker.lesson_server"

# Only the lesson server takes traffic (from the web app, with its bearer token).
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["lesson"]

[[vm]]
  memory = "1gb"
  cpus = 1
  processes = ["worker", "lesson"]
