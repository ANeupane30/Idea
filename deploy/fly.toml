# Fly.io app for the worker and the lesson server. The app name comes from CI (--app),
# one app per environment (staging, production). Secrets are set once with `fly secrets set`
# (see docs/deploy.md).
primary_region = "iad"

[processes]
  worker = "python -m worker"
  lesson = "python -m worker.lesson_server"

# Only the lesson server takes traffic (from the web app, with its bearer token).
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["lesson"]

[[vm]]
  memory = "1gb"
  cpus = 1
  processes = ["worker", "lesson"]
