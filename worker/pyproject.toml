[project]
name = "worker"
version = "0.1.0"
description = "Background worker for the adaptive learning platform"
authors = [
    { name = "aseemneupane30@gmail.com", email = "aseemneupane30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
worker = "worker.__main__:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
