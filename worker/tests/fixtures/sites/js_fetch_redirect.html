<!doctype html>
<html><head><meta charset="utf-8"><title>Start</title></head>
<body><p>Start page.</p><pre id="out"></pre>
<script>
  // A subrequest whose redirect points at a blocked host.
  fetch("/redirect?to=" + encodeURIComponent("http://localhost:" + location.port + "/secret.html"))
    .then((r) => r.text())
    .then((t) => { document.getElementById("out").textContent = t; })
    .catch(() => {});
</script>
</body></html>
