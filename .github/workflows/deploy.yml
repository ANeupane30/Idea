# A merge to staging deploys staging; a merge to main deploys production after approval
# (the production environment requires a reviewer; see docs/deploy.md).
# Order: database migrations, then the worker and lesson server (Fly.io), then the web app (Vercel).
# Each step is skipped, with a notice, until its secrets are set for the environment.
name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Database migrations (Supabase)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase not configured for this environment; skipping migrations."
            exit 0
          fi
          npm ci
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Set up flyctl
        if: env.FLY_API_TOKEN != '' && env.FLY_APP != ''
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Worker and lesson server (Fly.io)
        run: |
          if [ -z "$FLY_API_TOKEN" ] || [ -z "$FLY_APP" ]; then
            echo "::notice::Fly.io not configured for this environment; skipping the worker deploy."
            exit 0
          fi
          flyctl deploy --remote-only --config deploy/fly.toml --dockerfile deploy/worker.Dockerfile --app "$FLY_APP" .

      - name: Web app (Vercel)
        working-directory: web
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel not configured for this environment; skipping the web deploy."
            exit 0
          fi
          # Each environment has its own Vercel project, deployed as that project's production.
          npx --yes vercel@59.26.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@59.26.0 build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@59.26.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
