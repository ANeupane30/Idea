# When CI passes on dev, open (or refresh) the dev -> staging promotion pull request.
name: Promote dev to staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the promotion pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          body="Promotes dev to staging. CI passed on dev at ${SHA:0:7}.

          After merging, staging deploys for QA: fill in docs/qa/qa-report-template.md."
          existing="$(gh pr list --base staging --head dev --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "Updated #$existing"
          else
            gh pr create --base staging --head dev --title "Promote dev to staging" --body "$body"
          fi
